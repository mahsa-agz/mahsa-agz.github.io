  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="610" cy="370" r="270" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 590H1020" stroke="#a5bed4" stroke-opacity=".35" stroke-width="2"/>
    <path d="M250 590C352 590 388 500 445 405C498 315 548 250 600 250C652 250 702 315 755 405C812 500 848 590 950 590" fill="url(#accent)" fill-opacity=".12" stroke="url(#accent)" stroke-width="5"/>
    <path d="M250 590C352 590 388 528 445 452C498 382 548 344 600 344C652 344 702 382 755 452C812 528 848 590 950 590" stroke="#d9f4e8" stroke-opacity=".55" stroke-width="2"/>
    <path d="M420 590V370M600 590V250M780 590V370" stroke="#d8f2e4" stroke-opacity=".55" stroke-width="3" stroke-dasharray="10 12"/>
    <path d="M420 655V620M600 655V620M780 655V620" stroke="#d8f2e4" stroke-opacity=".8" stroke-width="5"/>
    <path d="M330 510H870" stroke="#7aa993" stroke-opacity=".35" stroke-width="2"/>
  </g>
  <g fill="#d9f4e6">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Statistical methods category cover</title>
  <desc id="desc">A professional cover with a bell curve, confidence band, and interval markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="55%" stop-color="#142840"/>
      <stop offset="100%" stop-color="#09111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4ead2"/>
      <stop offset="100%" stop-color="#5a9c7a"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#607896" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="52%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#5a9c7a" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#5a9c7a" stop-opacity="0"/>
    </radialGradient>

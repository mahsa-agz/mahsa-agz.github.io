<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Databases category cover</title>
  <desc id="desc">A professional cover with structured tables, query paths, and database stacks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="52%" stop-color="#14253f"/>
      <stop offset="100%" stop-color="#09111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d7ca"/>
      <stop offset="100%" stop-color="#8a6a52"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#607996" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="51%" cy="45%" r="49%">
      <stop offset="0%" stop-color="#8a6a52" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#8a6a52" stop-opacity="0"/>
    </radialGradient>

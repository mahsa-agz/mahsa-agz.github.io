  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="610" cy="360" r="280" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="170" y="220" width="370" height="320" rx="24" stroke="#dcccbe" stroke-opacity=".55" stroke-width="2"/>
    <path d="M170 300H540M170 380H540M170 460H540M290 220V540M410 220V540" stroke="#dcccbe" stroke-opacity=".28" stroke-width="2"/>

    <path d="M730 260V500C730 520 784 536 850 536C916 536 970 520 970 500V260" stroke="url(#accent)" stroke-width="4"/>
    <ellipse cx="850" cy="340" rx="120" ry="34" stroke="#ecdccf" stroke-opacity=".65" stroke-width="2"/>
    <ellipse cx="850" cy="420" rx="120" ry="34" stroke="#ecdccf" stroke-opacity=".65" stroke-width="2"/>
    <path d="M535 400H670L720 350" stroke="#ecdccf" stroke-opacity=".72" stroke-width="4"/>
  </g>
  <g fill="#e7d6c8">
    <rect x="205" y="250" width="50" height="24" rx="6"/><rect x="325" y="250" width="50" height="24" rx="6"/><rect x="445" y="250" width="50" height="24" rx="6"/><rect x="205" y="332" width="170" height="24" rx="6"/><rect x="205" y="412" width="110" height="24" rx="6"/><rect x="205" y="492" width="200" height="24" rx="6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Deep learning category cover</title>
  <desc id="desc">A professional cover with layered neural network nodes and flowing connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="53%" stop-color="#14243f"/>
      <stop offset="100%" stop-color="#09101a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d8ff"/>
      <stop offset="100%" stop-color="#8d6cae"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#5d7694" stroke-opacity=".19" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8d6cae" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#8d6cae" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="610" cy="360" r="280" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M330 240L500 320L690 250L870 360" stroke="#d8c6ee" stroke-opacity=".35" stroke-width="2"/>
    <path d="M330 400L500 320L690 430L870 360" stroke="#d8c6ee" stroke-opacity=".35" stroke-width="2"/>
    <path d="M330 560L500 480L690 430L870 520" stroke="#d8c6ee" stroke-opacity=".35" stroke-width="2"/>
    <path d="M330 240L500 480L690 250L870 520" stroke="#d8c6ee" stroke-opacity=".2" stroke-width="2"/>
    <path d="M330 560L500 320L690 430L870 360" stroke="#d8c6ee" stroke-opacity=".2" stroke-width="2"/>
    <path d="M880 360C930 360 965 330 1010 290" stroke="url(#accent)" stroke-width="5"/>
    <path d="M880 520C930 520 968 548 1010 592" stroke="url(#accent)" stroke-width="5"/>
  </g>
  <g fill="#e4d5f5">
    <circle cx="330" cy="240" r="18"/><circle cx="330" cy="400" r="18"/><circle cx="330" cy="560" r="18"/><circle cx="500" cy="320" r="22"/><circle cx="500" cy="480" r="22"/><circle cx="690" cy="250" r="20"/><circle cx="690" cy="430" r="24"/><circle cx="870" cy="360" r="28"/><circle cx="870" cy="520" r="20"/>

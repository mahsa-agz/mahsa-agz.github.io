/* Layout: lesson app inside the personal site. Home = grid of chapters; lesson = one card per screen + bottom button.
   Every rule is scoped to .aimath so the site header and footer keep their own look; colors follow the site palette. */
.aimath { --bg: #ffffff; --card: #fafbfc; --soft: #eef1f3; --ink: #14171c; --muted: #5e6772; --line: #d2d5db; --accent: #3e6a64; --accent-ink: #ffffff; --blue: #2563d9; --orange: #d9731c; --green: #2f855a; --red: #c53030; --font: "Vazirmatn", "Inter", Tahoma, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .aimath { --bg: #0f1419; --card: #181d24; --soft: #222831; --ink: #ecedee; --muted: #9aa3ad; --line: #2e3440; --accent: #8cc4bc; --accent-ink: #0f1419; --blue: #6b9bff; --orange: #f39a4a; --green: #5fcf95; --red: #ff6b6b; color-scheme: dark; } }
:root[data-theme="dark"] .aimath { --bg: #0f1419; --card: #181d24; --soft: #222831; --ink: #ecedee; --muted: #9aa3ad; --line: #2e3440; --accent: #8cc4bc; --accent-ink: #0f1419; --blue: #6b9bff; --orange: #f39a4a; --green: #5fcf95; --red: #ff6b6b; color-scheme: dark; }
.aimath * { box-sizing: border-box; }
.aimath { background: var(--bg); color: var(--ink); font: 17px/1.9 var(--font); margin: 0; }
.aimath .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }
.aimath h1, .aimath h2 { line-height: 1.5; text-wrap: balance; margin: 0; }
.aimath button { font: inherit; color: inherit; cursor: pointer; }
.aimath button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.aimath .en { font-family: "Segoe UI", system-ui, sans-serif; font-size: .82em; color: var(--muted); font-weight: 500; }
.aimath .eq { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.aimath .v { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 700; }
.aimath .hello { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 22px; }
.aimath .hello h1 { font-size: 28px; font-weight: 800; }
.aimath .hello p { margin: 0; color: var(--muted); }
.aimath .unit { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 16px 20px; margin-bottom: 18px; }
.aimath .unit small { opacity: .85; }
.aimath .unit h2 { font-size: 22px; }
.aimath .unit .en { color: inherit; opacity: .8; }
.aimath .bar { height: 8px; border-radius: 9px; background: color-mix(in srgb, var(--accent-ink) 25%, transparent); margin-top: 10px; overflow: hidden; }
.aimath .bar > i { display: block; height: 100%; background: var(--accent-ink); border-radius: 9px; transition: width .4s; }
.aimath .path { display: flex; flex-direction: column; gap: 10px; }

.aimath .lesson .num { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--soft); }
.aimath .lesson .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.5; }
.aimath .lesson b { font-size: 17px; }
.aimath .lesson .state { margin-inline-start: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.aimath .lesson.open { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.aimath .lesson.open .num { background: var(--accent); color: var(--accent-ink); }
.aimath .lesson.done .num { background: var(--green); color: #fff; }
.aimath .lesson.locked { opacity: .55; cursor: default; }
.aimath .later { margin-top: 28px; }

.aimath .aichips { display: flex; flex-wrap: wrap; gap: 8px; }

.aimath .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.aimath .close { background: none; border: 0; font-size: 26px; color: var(--muted); width: 40px; height: 40px; line-height: 1; }
.aimath .prog { flex: 1; height: 12px; background: var(--soft); border-radius: 9px; overflow: hidden; }
.aimath .prog > i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .35s; }
.aimath .card { display: flex; flex-direction: column; gap: 14px; animation: in .3s ease; }
@keyframes in { from { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .aimath .card { animation: none; } }
.aimath .card h2 { font-size: 23px; font-weight: 800; }
.aimath .card p { margin: 0; }
.aimath .key { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 2px solid var(--accent); border-radius: 16px; padding: 14px 16px; font-size: 18px; }
.aimath .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.aimath .tag { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 2px 12px; border-radius: 99px; }
.aimath .ai { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 16px; }

.aimath .read { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; text-align: center; font-size: 18px; }

.aimath .slider input { flex: 1; accent-color: var(--green); height: 30px; }
.aimath .sort { display: flex; flex-direction: column; gap: 10px; }
.aimath .item { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

.aimath .two { display: flex; gap: 8px; }
.aimath .two button { flex: 1; border: 2px solid var(--line); background: var(--soft); border-radius: 12px; padding: 6px; font-weight: 700; }
.aimath .item.right { border-color: var(--green); }
.aimath .item.wrong { border-color: var(--red); }
.aimath .item .why { font-size: 15px; color: var(--muted); }
.aimath .item .why b { color: var(--ink); }
.aimath .opt { text-align: right; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-weight: 500; }
.aimath .opt.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--card)); }
.aimath .opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, var(--card)); }
.aimath .say { font-weight: 700; }
.aimath .say.ok { color: var(--green); }
.aimath .say.no { color: var(--red); }
.aimath .foot { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.aimath .go { display: block; width: 100%; max-width: 560px; margin: 0 auto; border: 0; border-radius: 16px; padding: 12px; font-size: 19px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }

.aimath .wrap.wide { max-width: 1440px; }

.aimath .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px 32px; align-items: start; }

.aimath .go { max-width: 760px; }
.aimath .t-play .txt, .aimath .t-play .pic { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 900px) { .aimath .card h2 { font-size: 26px; } .aimath { font-size: 18px; } }

}

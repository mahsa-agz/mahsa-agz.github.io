<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ریاضی هوش مصنوعی</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column, like a phone lesson app. Home = path of lessons; lesson = one card per screen + big bottom button. */
:root {
  --bg: #f4f6f5; --card: #ffffff; --soft: #e9eeec; --ink: #17201d; --muted: #5f6b67; --line: #d8e0dd;
  --accent: #0e7a6b; --accent-ink: #ffffff;
  --blue: #2563d9; --orange: #e0761a; --green: #14935f; --red: #d23c3c;
  --font: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --card: #1b2220; --soft: #252e2b; --ink: #e8eeec; --muted: #9aa8a3; --line: #2f3a37;
  --accent: #2fb39f; --accent-ink: #0b1311; --blue: #6b9bff; --orange: #f39a4a; --green: #3fcf8e; --red: #ff6b6b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121715; --card: #1b2220; --soft: #252e2b; --ink: #e8eeec; --muted: #9aa8a3; --line: #2f3a37;
  --accent: #2fb39f; --accent-ink: #0b1311; --blue: #6b9bff; --orange: #f39a4a; --green: #3fcf8e; --red: #ff6b6b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.9 var(--font); margin: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }
h1, h2 { line-height: 1.5; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.en { font-family: "Segoe UI", system-ui, sans-serif; font-size: .82em; color: var(--muted); font-weight: 500; }
.eq { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.v { direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 700; }

/* Home */
.hello { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 22px; }
.hello h1 { font-size: 28px; font-weight: 800; }
.hello p { margin: 0; color: var(--muted); }
.unit { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 16px 20px; margin-bottom: 18px; }
.unit small { opacity: .85; }
.unit h2 { font-size: 22px; }
.unit .en { color: inherit; opacity: .8; }
.bar { height: 8px; border-radius: 9px; background: color-mix(in srgb, var(--accent-ink) 25%, transparent); margin-top: 10px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent-ink); border-radius: 9px; transition: width .4s; }
.path { display: flex; flex-direction: column; gap: 10px; }
.lesson { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.lesson .num { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--soft); }
.lesson .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.5; }
.lesson b { font-size: 17px; }
.lesson .state { margin-inline-start: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.lesson.open { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.lesson.open .num { background: var(--accent); color: var(--accent-ink); }
.lesson.done .num { background: var(--green); color: #fff; }
.lesson.locked { opacity: .55; cursor: default; }
.later { margin-top: 28px; }
.later h3 { font-size: 15px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border: 1px dashed var(--line); border-radius: 99px; padding: 4px 14px; font-size: 15px; color: var(--muted); }

/* Lesson player */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.close { background: none; border: 0; font-size: 26px; color: var(--muted); width: 40px; height: 40px; line-height: 1; }
.prog { flex: 1; height: 12px; background: var(--soft); border-radius: 9px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .35s; }
.card { display: flex; flex-direction: column; gap: 14px; animation: in .3s ease; }
@keyframes in { from { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
.card h2 { font-size: 23px; font-weight: 800; }
.card p { margin: 0; }
.key { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 2px solid var(--accent); border-radius: 16px; padding: 14px 16px; font-size: 18px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tag { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 2px 12px; border-radius: 99px; }
.ai { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 16px; }
.ai .tag { color: var(--bg); background: color-mix(in srgb, var(--bg) 18%, transparent); }

canvas { display: block; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; touch-action: none; }
.read { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; text-align: center; font-size: 18px; }
.slider { display: flex; align-items: center; gap: 12px; }
.slider input { flex: 1; accent-color: var(--green); height: 30px; }

.sort { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.item .q { font-weight: 700; }
.two { display: flex; gap: 8px; }
.two button { flex: 1; border: 2px solid var(--line); background: var(--soft); border-radius: 12px; padding: 6px; font-weight: 700; }
.item.right { border-color: var(--green); }
.item.wrong { border-color: var(--red); }
.item .why { font-size: 15px; color: var(--muted); }
.item .why b { color: var(--ink); }
.opt { text-align: right; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-weight: 500; }
.opt.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--card)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, var(--card)); }
.say { font-weight: 700; }
.say.ok { color: var(--green); } .say.no { color: var(--red); }

.foot { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line);
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.go { display: block; width: 100%; max-width: 560px; margin: 0 auto; border: 0; border-radius: 16px; padding: 12px; font-size: 19px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.go:disabled { background: var(--soft); color: var(--muted); box-shadow: none; cursor: default; }
.end { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-top: 40px; }
.end .big { font-size: 64px; line-height: 1; color: var(--green); font-weight: 800; }
.muted { color: var(--muted); font-size: 15px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nb, .theme { background: var(--card); border: 1px solid var(--line); border-radius: 10px; height: 40px; padding: 0 14px; font-size: 15px; }
.theme { width: 40px; padding: 0; }
.chapter { margin-bottom: 26px; }
.goal { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--muted); margin: -6px 0 16px; line-height: 1.6; }
.goal .g { background: var(--soft); color: var(--ink); border-radius: 99px; padding: 0 10px; }
.goal .g.now { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.who { font-size: 15px; color: var(--muted); border-inline-start: 3px solid var(--line); padding-inline-start: 12px; }
.formula { direction: ltr; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 8px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 10px; }
.tok { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tok > span { font: 700 30px/1.2 "Segoe UI", system-ui, sans-serif; color: var(--c, var(--ink)); }
.tok small { direction: rtl; font-size: 12px; line-height: 1.4; color: var(--c, var(--muted)); max-width: 104px; text-align: center; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 4px 12px; font-size: 15px; }
.btns button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); font-weight: 700; }
.chips .chip { color: var(--ink); border-style: solid; }
.qbox { border-color: var(--red); }
.sheet { background: var(--card); border: 2px dashed var(--accent); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet ul { margin: 0; padding-inline-start: 22px; }
.sheet .key { font-size: 16px; }
.bad { color: var(--red); }
.ladder.have { border-color: var(--green); }
details summary { cursor: pointer; }
details[open] summary { margin-bottom: 6px; }
</style>

<div class="wrap" id="app" dir="rtl" lang="fa"></div>
<div class="foot" id="foot" dir="rtl" hidden><button class="go" id="go">ادامه</button></div>

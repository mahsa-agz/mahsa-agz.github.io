<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root { --page: #f6f7f9; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0f1419; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #0f1419; color-scheme: dark; }
html, body { margin: 0; background: var(--page); }
.cp { --bg: #f6f7f9; --card: #ffffff; --soft: #eef1f4; --ink: #17202a; --muted: #5f6b77; --line: #dde2e7; --accent: #1f7a6f; --accent-ink: #ffffff;
  --easy: #1e8a4c; --med: #b8730a; --hard: #c23b3b; --kw: #8a3ffc; --str: #1e8a4c; --num: #b8730a; --com: #8a94a0; --fnc: #0b62c4;
  color: var(--ink); background: var(--bg); min-height: 100vh; font: 16px/1.8 "Vazirmatn", Tahoma, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cp { --bg: #0f1419; --card: #181d24; --soft: #222831; --ink: #ecedee; --muted: #9aa3ad; --line: #2e3440; --accent: #8cc4bc; --accent-ink: #0f1419; --easy: #5fcf95; --med: #f0b35a; --hard: #ff7b7b; --kw: #c4a1ff; --str: #8fd9a8; --num: #f0b35a; --com: #7d8793; --fnc: #7fb2ff; } }
:root[data-theme="dark"] .cp { --bg: #0f1419; --card: #181d24; --soft: #222831; --ink: #ecedee; --muted: #9aa3ad; --line: #2e3440; --accent: #8cc4bc; --accent-ink: #0f1419; --easy: #5fcf95; --med: #f0b35a; --hard: #ff7b7b; --kw: #c4a1ff; --str: #8fd9a8; --num: #f0b35a; --com: #7d8793; --fnc: #7fb2ff; }

.cp * { box-sizing: border-box; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
.top a.home { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; }
.top .end { display: flex; gap: 8px; align-items: center; }
button, .btn { font-family: inherit; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 7px 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.on { background: var(--soft); border-color: var(--accent); }
h1 { font-size: 26px; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 15px; color: var(--muted); margin: 28px 0 10px; }
h3 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 8px; }
code { unicode-bidi: isolate; direction: ltr; font: 0.9em ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
pre { direction: ltr; text-align: left; margin: 10px 0; padding: 12px 14px; background: var(--soft); border-radius: 10px; overflow-x: auto; font: 13.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; }
pre code { background: none; padding: 0; font-size: inherit; }
.k { color: var(--kw); } .s { color: var(--str); } .n { color: var(--num); } .c { color: var(--com); font-style: italic; } .f { color: var(--fnc); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 10px 0; }
.card p:first-child { margin-top: 0; } .card p:last-child { margin-bottom: 0; }
ul { padding-inline-start: 20px; margin: 6px 0; } li { margin: 3px 0; }
.note { color: var(--muted); font-size: 14px; }

/* home */
.today { border-color: var(--accent); }
.today .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.due a { color: var(--ink); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; color: var(--muted); margin: 6px 0 0; padding: 0; list-style: none; }
.steps li { background: var(--soft); border-radius: 8px; padding: 3px 9px; margin: 0; }
.path { list-style: none; padding: 0; margin: 0; }
.path li { margin: 0; }
.path a, .path .soon { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; margin: 8px 0; color: var(--ink); text-decoration: none; }
.path a:hover { border-color: var(--accent); }
.path .soon { opacity: .5; }
.path .mixrow { background: var(--soft); }
.num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--soft); border: 1px solid var(--line); }
.mixrow .num { background: var(--card); }
.done .num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.path .txt { flex: 1; min-width: 0; } .path .txt b { display: block; } .path .txt span { color: var(--muted); font-size: 14px; }
.prog { flex: none; font-size: 13px; color: var(--muted); }

/* pattern page */
.viz { margin: 14px 0 4px; }
.vrow { direction: ltr; justify-content: flex-end; display: flex; gap: 4px; flex-wrap: wrap; }
.cell { position: relative; min-width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); font: 600 15px ui-monospace, Consolas, monospace; margin-bottom: 20px; }
.cell.in { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
.cell i { position: absolute; top: 40px; font: 700 12px system-ui, sans-serif; color: var(--accent); }
.vnote { font-size: 14px; color: var(--muted); }
.cell.out { opacity: .3; text-decoration: line-through; }
.demo { border-color: var(--accent); }
.demo .fields { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.demo label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); flex: 1 1 140px; }
.demo input { font: 15px ui-monospace, Consolas, monospace; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--ink); }
.demo .stage { min-height: 120px; padding: 12px 0 4px; }
.demo .stage .vnote { font-size: 15px; color: var(--ink); margin: 2px 0 10px; }
.kv { font: 13px ui-monospace, Consolas, monospace; background: var(--soft); border-radius: 8px; padding: 4px 9px; }
.spot li::marker { content: "←  "; color: var(--accent); }
.tiktok { border-inline-start: 4px solid var(--accent); }

/* problem card */
.prob header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.prob header h3 { flex: 1 1 200px; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.E { color: var(--easy); } .M { color: var(--med); } .H { color: var(--hard); }
.freq { font-size: 12px; color: var(--muted); }
.st { font-size: 12px; font-weight: 600; color: var(--muted); }
.st.due { color: var(--hard); } .st.ok { color: var(--easy); }
.plain { margin: 10px 0; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.rev { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rev b.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.mark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.guess { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.guess .right { border-color: var(--easy); color: var(--easy); } .guess .wrong { border-color: var(--hard); color: var(--hard); }
.tell { margin-top: 8px; font-size: 15px; }
.prob.flash { animation: flash 1.2s; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: none; } }
.back { color: var(--muted); text-decoration: none; font-size: 14px; }

/* site menu (only on the website) */
.sitemenu { position: relative; }
.sitemenu summary { list-style: none; height: 36px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; font-size: 14px; cursor: pointer; }
.sitemenu summary::-webkit-details-marker { display: none; }
.sitemenu nav { position: absolute; left: 0; top: 42px; z-index: 30; min-width: 160px; display: flex; flex-direction: column; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.sitemenu a { padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.sitemenu a:hover { background: var(--soft); }
@media (max-width: 520px) { h1 { font-size: 22px; } .wrap { padding-top: 12px; } }
</style>
<meta name="description" content="TikTok coding interview prep by pattern: concepts, templates, and real TikTok-tagged LeetCode problems with hints and solutions.">

  window.SITE_MENU = "<details class=\"sitemenu\"><summary aria-label=\"Site menu\">☰ Mahsa</summary><nav><a href=\"/\">Home</a><a href=\"/about/\">About</a><a href=\"/work/\">Projects</a><a href=\"/publications/\">Publications</a><a href=\"/#contact\">Contact</a></nav></details>";
</script>

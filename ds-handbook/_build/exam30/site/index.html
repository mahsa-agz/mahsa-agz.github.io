<title>DS Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Vazirmatn:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: a study handbook. Sticky top bar (name, tabs, search, language); in each tab a section index on the
   side and the reading column; the plan tab is a 30-day board plus the mistake log. */
:root {
  --paper: #f6f7f4;
  --card: #ffffff;
  --ink: #1d2433;
  --ink-soft: #4a5468;
  --rule: #d9ddd3;
  --accent: #0f6b5c;        /* deep exam-room green */
  --accent-ink: #ffffff;
  --mark: #fde68a;          /* highlighter */
  --easy: #2f855a;
  --medium: #b7791f;
  --hard: #c53030;
  --code-bg: #eef1ea;
  --font-display: "Bricolage Grotesque", "Vazirmatn", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Vazirmatn", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13171c; --card: #1b2027; --ink: #e7eae4; --ink-soft: #a9b1bd; --rule: #2e353f;
    --accent: #4fd1b5; --accent-ink: #0b1714; --mark: #6b5a17; --easy: #68d391; --medium: #f6c26b;
    --hard: #fc8181; --code-bg: #20262e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13171c; --card: #1b2027; --ink: #e7eae4; --ink-soft: #a9b1bd; --rule: #2e353f;
  --accent: #4fd1b5; --accent-ink: #0b1714; --mark: #6b5a17; --easy: #68d391; --medium: #f6c26b;
  --hard: #fc8181; --code-bg: #20262e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--font-body); }
:lang(fa) body, body.fa { font-family: "Vazirmatn", var(--font-body); }
body.ko { font-family: "Noto Sans KR", var(--font-body); word-break: keep-all; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper);
  border-bottom: 1px solid var(--rule); padding-inline: 16px; }
.top-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  max-width: 1240px; margin-inline: auto; padding-block: 12px 8px; }
.brand { font: 700 1.25rem/1.1 var(--font-display); letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; }
.brand small { font: 400 0.8rem var(--font-mono); color: var(--ink-soft); letter-spacing: 0.04em; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { width: min(320px, 70vw); padding: 8px 12px; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--card); color: var(--ink); font: inherit; font-size: 0.95rem; }
.lang { display: flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.lang button { border: 0; background: var(--card); color: var(--ink); padding: 7px 11px; cursor: pointer; font: 600 0.85rem var(--font-body); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 1240px; margin-inline: auto; scrollbar-width: thin; }
nav.tabs button { border: 0; background: transparent; color: var(--ink-soft); padding: 8px 12px 10px; cursor: pointer;
  font: 600 0.95rem var(--font-body); white-space: nowrap; border-bottom: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1240px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 60px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
.toc { position: sticky; top: 112px; max-height: calc(100vh - 130px); overflow: auto; font-size: 0.92rem;
  border-inline-end: 1px solid var(--rule); padding-inline-end: 12px; }
.toc a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--ink-soft); text-decoration: none; }
.toc a:hover, .toc a.on { background: var(--card); color: var(--ink); }
.toc .toc-title { font: 700 0.75rem var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 8px 8px; }
.reading { min-width: 0; }
.tab-intro { max-width: 72ch; color: var(--ink-soft); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; }
h1 { font-size: 2rem; margin: 0 0 8px; }
.section { padding-block: 22px; border-top: 1px solid var(--rule); scroll-margin-top: 120px; }
.section h2 { font-size: 1.5rem; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.section .sid { font: 400 0.75rem var(--font-mono); color: var(--ink-soft); }
.section .summary { color: var(--ink-soft); margin: 0 0 12px; max-width: 72ch; }
.prose { max-width: 78ch; }
.prose h3 { font-size: 1.15rem; margin: 22px 0 6px; }
.prose p, .prose li { max-width: 72ch; }
.prose table { border-collapse: collapse; font-size: 0.92rem; }
.prose th, .prose td { border: 1px solid var(--rule); padding: 6px 10px; text-align: start; vertical-align: top; }
.prose th { background: var(--code-bg); }
.table-wrap { overflow-x: auto; margin-block: 12px; }
.prose code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.prose pre { direction: ltr; text-align: left; background: var(--code-bg); border-radius: var(--radius); padding: 14px 16px;
  overflow-x: auto; font-size: 0.86rem; line-height: 1.5; position: relative; }
.prose pre code { background: none; padding: 0; }
.prose blockquote { margin: 12px 0; padding: 8px 14px; border-inline-start: 4px solid var(--accent); background: var(--card); border-radius: 0; }
.prose mark { background: var(--mark); color: inherit; padding: 0 3px; }
.copy { position: absolute; top: 6px; inset-inline-end: 6px; font: 600 0.72rem var(--font-body); border: 1px solid var(--rule);
  background: var(--card); color: var(--ink-soft); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.hljs-keyword, .hljs-built_in { color: var(--accent); font-weight: 600; }
.hljs-string { color: var(--medium); }
.hljs-comment { color: var(--ink-soft); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--hard); }
.hljs-title, .hljs-function { color: var(--ink); font-weight: 600; }
/* plan */
.plan-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
.stat-line { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.stat-line b { color: var(--ink); font-size: 1.2rem; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.day { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.day.today { outline: 3px solid var(--accent); }
.day header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day h3 { margin: 0; font-size: 1.05rem; }
.pill { font: 600 0.72rem var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.pill.easy { color: var(--easy); } .pill.medium { color: var(--medium); } .pill.hard { color: var(--hard); }
.pill.mock { color: var(--accent); }
.day ul { margin: 0; padding-inline-start: 18px; font-size: 0.9rem; }
.day .area { font: 700 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 14px; border-top: 1px dashed var(--rule); padding-top: 8px; font-size: 0.88rem; }
.checks label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; margin-block: 16px; }
.panel h2 { margin: 0 0 10px; font-size: 1.3rem; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.form-row label { display: grid; gap: 3px; font-size: 0.82rem; color: var(--ink-soft); }
.form-row input, .form-row select { padding: 7px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: 0.92rem; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; font: 600 0.9rem var(--font-body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.mlist { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.mlist th, .mlist td { border-bottom: 1px solid var(--rule); padding: 6px 8px; text-align: start; }
.due { color: var(--hard); font-weight: 600; }
.note { color: var(--ink-soft); font-size: 0.85rem; }
/* flashcards */
.cards { display: grid; gap: 12px; max-width: 820px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; }
.card .q { font-weight: 600; }
.card .meta { font: 0.75rem var(--font-mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
.card .a { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--rule); }
.daypick { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 12px; }
.daypick button { min-width: 2.4rem; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 8px; cursor: pointer; font: 600 0.85rem var(--font-body); font-variant-numeric: tabular-nums; }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.results { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px; margin-bottom: 16px; }
.results a { display: block; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.results a:hover { background: var(--paper); }
.results small { color: var(--ink-soft); }
.status { color: var(--ink-soft); font-size: 0.85rem; }
[dir="rtl"] .prose pre, [dir="rtl"] code { direction: ltr; unicode-bidi: isolate; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .toc { position: static; max-height: none; border-inline-end: 0; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .toc details summary { cursor: pointer; font-weight: 600; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="top-row">
    <div class="brand" id="brand">DS Handbook <small id="brand-sub">30 days</small></div>
    <div class="tools">
      <input id="search" class="search" type="search" placeholder="Search" aria-label="Search">
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-en" data-lang="en" aria-pressed="true">EN</button>
        <button id="lang-fa" data-lang="fa" aria-pressed="false">فا</button>
        <button id="lang-ko" data-lang="ko" aria-pressed="false">한</button>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</header>
<main id="main">
  <p class="status" id="loading">Loading the handbook…</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<script src="app.js"></script>

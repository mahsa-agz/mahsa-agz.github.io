- title: "Memory-efficient money-laundering detection"
  badge: "Independent project"
  image: "/assets/images/projects/aml_pipeline.webp"
  fit: contain
  alt: "Detection and explanation pipeline for money-laundering alerts"
  desc: >-
    Showed that a fixed-size memory per account is a possible alternative
    to a full transaction graph: on the TransXion benchmark (3M
    transactions), XGBoost test average precision rose from 0.237 to
    0.364, close to graph neural networks (approximate comparison). An
    explanation layer (RAG, an LLM explainer and automated checks)
    describes each alert for an analyst.
  tags: [Anomaly Detection, XGBoost, RAG, LLM]
  featured: true
  links:
    - { label: "GitHub", url: "https://github.com/mahsa-agz/memory-efficient-aml-detection" }

- title: "ErgoYar: computer vision-based ergonomic risk assessment"
  badge: "M.Sc. thesis · published"
  image: "/assets/images/projects/ergoyar_app.webp"
  fit: contain
  alt: "ErgoYar app screens: overview, body-part scores with suggestions, and joint-angle details"
  desc: >-
    Benchmarked monocular 3D pose estimation (MediaPipe, MMPose) against
    optical motion capture across three camera views and nine tasks with
    different levels of occlusion; MediaPipe reached ICC 0.87 (REBA) and
    0.92 (RULA). Built the result into ErgoYar, a mobile app that scores
    ergonomic risk from video and recommends posture adjustments (mean
    SUS 80.5 with first-time users).
  tags: [Computer Vision, Pose Estimation, Flutter, FastAPI, HCI]
  featured: true
  links:
    - { label: "Paper", url: "https://doi.org/10.1016/j.ergon.2026.104061" }
    - { label: "Read more", url: "/about/#research" }

- title: "Cold-Start Music Recommender"
  image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=760&q=85"
  alt: "Music recommendation system project"
  desc: >-
    CCFCRec on 1M Yahoo! Music interactions, tested on a strict cold-start
    split of 25,295 unseen songs. HR@5 of 0.768, 1.46× a content-KNN
    baseline; an ablation shows the contrastive loss drives the gain.
  tags: [Recommenders, Contrastive Learning, PyTorch]
  links:
    - { label: "GitHub", url: "https://github.com/mahsa-agz/Music-Recommendation-System" }

- title: "EnsembleEFT"
  image: "/assets/images/projects/ensembleeft.webp"
  fit: contain
  alt: "Confusion matrices and Grad-CAM maps for ShuffleNet, MobileNet and SqueezeNet on FER-2013"
  desc: >-
    An ensemble of three compact CNNs (ShuffleNet, MobileNet, SqueezeNet)
    on FER-2013 that came within 1.6 points of EfficientNet-B3 accuracy
    with 59% less training time and 44% fewer MACs; Grad-CAM guided the
    choice of complementary architectures.
  tags: [Computer Vision, Ensemble Learning, Efficient Deep Learning]
  links:
    - { label: "GitHub", url: "https://github.com/mahsa-agz/EnsembleEFT" }


- title: "CV-based ergonomic risk assessment"
  badge: "M.Sc. thesis · published"
  image: "https://images.unsplash.com/photo-1581092795360-fd1ca04f0952?auto=format&fit=crop&w=760&q=85"
  alt: "Computer vision ergonomic assessment thesis project"
  desc: >-
    Validated monocular 3D pose estimation (MediaPipe, MMPose) against
    8-camera optical motion capture across three camera views, and
    measured when kinematic error changes REBA / RULA risk decisions.
    ICCs of 0.87 (REBA) and 0.92 (RULA).
  tags: [Computer Vision, Pose Estimation, REBA / RULA]
  featured: true
  links:
    - { label: "Paper", url: "https://doi.org/10.1016/j.ergon.2026.104061" }
    - { label: "Read more", url: "/about/#research" }

- title: "Cold-Start Music Recommender"
  image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=760&q=85"
  alt: "Music recommendation system project"
  desc: >-
    CCFCRec on 1M Yahoo! Music interactions, tested on a strict cold-start
